[theme]

base = "light"

# Primary color (used for buttons, interactive elements)
primaryColor = "#FF6B6B"

# Background color for the main content area
backgroundColor = "#FFFFFF"

# Background color for the sidebar and most interactive widgets
secondaryBackgroundColor = "#F0F2F6"

# Color used for almost all text
textColor = "#31333F"

# Font settings
font = "sans serif"

# Custom fonts (requires CSS injection in your app)
[theme.fonts]
headerFont = "Lilita One, sans-serif"
bodyFont = "'Open Sans', sans-serif"